name: Bootstrap GlazeDE source import

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: github.event.head_commit.message == 'Bootstrap GlazeDE source import'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GlazeDE
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Import Glaze from Kiln beta
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch beta --single-branch --filter=blob:none \
            https://github.com/hexsourceorg/kiln-gnu-linux.git /tmp/kiln-source

          test -f /tmp/kiln-source/glaze/Cargo.toml
          test -f /tmp/kiln-source/glaze/LICENSE-MIT
          test -f /tmp/kiln-source/glaze/LICENSE-APACHE
          count="$(find /tmp/kiln-source/glaze -type f | wc -l)"
          echo "Glaze source files: $count"
          if (( count < 700 )); then
            echo "Unexpectedly small Glaze checkout; refusing incomplete import" >&2
            exit 1
          fi

          cp -a /tmp/kiln-source/glaze/. .
          cat >> README.md <<'EOF'

          ## Hexsource project

          GlazeDE is maintained by [Hexsource](https://github.com/hexsourceorg).
          It was originally developed inside [Kiln GNU/Linux](https://github.com/hexsourceorg/kiln-gnu-linux/tree/beta/glaze).
          Kiln retains a working copy for compatibility during the repository transition.
          EOF

          # The import workflow is temporary; the source's own CI workflow remains.
          rm -f .github/workflows/bootstrap-glazede.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete GlazeDE source from Kiln beta"
          git push origin HEAD:main
